name: 맥 앱 만들기

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 검사 엔진 테스트
        run: npm test
      - name: 실제 맥에서 전체 흐름 확인 (검사 → 선택 → 휴지통)
        run: npm run test:ui
      - name: 앱 만들기 (Apple Silicon + Intel)
        run: npm run dist
      - name: 만들어진 앱 서명 확인
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Malkkeum.app
          codesign --verify --deep --strict --verbose=2 dist/mac/Malkkeum.app
          ls -lh dist/*.dmg
      - name: 만들어진 앱을 실제로 띄워 전체 흐름 확인
        # 포장하기 전에는 되던 것이 설치 파일로 만든 뒤 안 되는 일을 잡는다
        run: MALKKEUM_BIN="$PWD/dist/mac-arm64/Malkkeum.app/Contents/MacOS/Malkkeum" npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: Malkkeum-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - name: 내려받기 페이지(릴리스)에 올리기
        # 두 브랜치가 같은 내용을 동시에 빌드하므로, 올리는 일은 기본 브랜치 한 곳에서만 한다 (서로 덮어쓰다 실패하는 것을 방지)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          NOTES="맥 저장공간 정리 도구 '말끔'. Apple Silicon(M1 이후) 맥은 arm64, 인텔 맥은 x64 파일을 받으세요. 설치 방법은 README를 참고하세요."
          # 같은 버전이 이미 있으면 파일만 교체한다
          gh release create "$TAG" dist/*.dmg --target "$GITHUB_SHA" --title "말끔 $VERSION" --notes "$NOTES" \
            || gh release upload "$TAG" dist/*.dmg --clobber
          # 새 버전이 올라간 뒤에는 이전 버전을 모두 지운다 (내려받기 페이지에는 항상 최신 하나만 남긴다)
          for OLD in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$OLD" != "$TAG" ]; then
              gh release delete "$OLD" --yes --cleanup-tag
            fi
          done
